<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franse werkwoorden oefenen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?font-display=swap&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="container">
        <header>
            <h1>Franse werkwoorden leren</h1>
            <p class="subtitle">Oefen de vervoegingen van veelgebruikte Franse werkwoorden</p>
        </header>

        <div class="card">
            <section id="intro">
                <p>Selecteer een werkwoord en een tijdsvorm om de volledige vervoegingen te zien, of start een simpele quiz.</p>
            </section>

            <div class="controls">
                <div class="form-group">
                    <label for="verbSelect">Werkwoord:</label>
                    <select id="verbSelect"></select>
                </div>

                <div class="form-group">
                    <label for="tenseSelect">Tijdsvorm:</label>
                    <select id="tenseSelect">
                        <option value="present">Présent</option>
                        <option value="passeCompose">Passé composé</option>
                        <option value="imparfait">Imparfait</option>
                        <option value="imperatif">Impératif</option>
                        <option value="futurProche">Futur proche</option>
                        <option value="futurSimple">Futur simple</option>
                        <option value="conditionnel">Conditionnel (futur du passé)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="showBtn">Toon vervoegingen</button>
                    <button id="quizBtn" class="secondary">Start quiz</button>
                </div>
            </div>

            <section id="conjugation" class="hidden">
                <h2 id="verbTitle"></h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>Persoon</th><th>Vervoeging</th></tr>
                        </thead>
                        <tbody id="conjBody"></tbody>
                    </table>
                </div>
                <p id="translation"></p>
                <div id="examplesSection">
                    <h3>Voorbeeldzinnen</h3>
                    <div id="examples"></div>
                </div>
            </section>

            <section id="quiz" class="hidden">
                <p id="scoreDisplay"></p>
                <h2>Quiz</h2>
                <p id="quizQuestion"></p>
                <div class="input-group">
                    <input type="text" id="quizAnswer" placeholder="Typ de vervoeging" autocomplete="off"/>
                    <button id="checkBtn">Controleren</button>
                    <button id="hintBtn">Hint</button>
                </div>
                <p id="hintDisplay"></p>
                <p id="quizResult"></p>
                <button id="nextBtn" class="hidden" disabled>Volgende</button>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
